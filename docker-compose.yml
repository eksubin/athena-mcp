# Self-hosted Supabase (db + auth + rest), reduced to the four services
# this app actually uses, behind a small Caddy gateway standing in for
# Kong — see supabase/gateway/Caddyfile. Realtime is deliberately not
# included yet: self-hosting it needs per-tenant provisioning that isn't
# worth the complexity for one "live updates" nice-to-have on /world,
# which still works fine without it (just needs a refresh to see others'
# changes instead of updating live).
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGPORT: 5432
      POSTGRES_PORT: 5432
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/docker/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/docker/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8001/auth/v1}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_SITE_URL:-http://localhost:3000}/auth/callback
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://localhost:8001/auth/v1}
      # Email/password sign-in, for testing without a browser capable of
      # the real Google OAuth handshake. Auto-confirm since there's no SMTP
      # configured to send a verification email — fine for prototyping,
      # reconsider both before any real public deploy.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8001/auth/v1}/callback

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    ports:
      - "8001:8001"
    volumes:
      - ./supabase/gateway/Caddyfile:/etc/caddy/Caddyfile:ro

  api:
    build: ./backend
    env_file: .env
    volumes:
      - resumes:/data/resumes
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - gateway

  web:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are baked into the client bundle at build
        # time — see frontend/Dockerfile. Pull them from the same .env
        # docker-compose already loads for `api`.
        # Browser-facing — must be the externally-reachable gateway address,
        # not ${SUPABASE_URL} (that's the Docker-internal one `api`/`worker`
        # use, meaningless to a browser on the host).
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:8001}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
        # Shows the email/password test-login form on /login — see
        # frontend/src/app/login/page.tsx. Unset for a real public deploy.
        NEXT_PUBLIC_ENABLE_TEST_LOGIN: ${ENABLE_TEST_LOGIN:-true}
    environment:
      # Not NEXT_PUBLIC_ on purpose — server-side code in this container
      # reaches `api`/`gateway` by their Docker service names, not the
      # browser-facing URLs above. See frontend/src/lib/api.ts and
      # frontend/src/lib/supabase/server.ts.
      API_INTERNAL_URL: http://api:8000
      SUPABASE_INTERNAL_URL: http://gateway:8001
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  worker:
    build: ./worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  resumes:
  db_data:

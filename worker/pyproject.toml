[project]
name = "athena-worker"
version = "0.1.0"
description = "Scheduled ingestion — Hacker News 'Who is hiring' only. See README for why LinkedIn/Twitter aren't here."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena_worker"]

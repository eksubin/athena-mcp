[project]
name = "athena-mcp"
version = "0.2.0"
description = "Thin MCP server — every tool is a typed call to the Athena backend API, which does the ranking/summarizing server-side."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[project.scripts]
athena-mcp = "athena_mcp.server:main"

[dependency-groups]
# scripts/smoke_test.py mints a disposable account's JWT to create the
# access token it then runs the server with.
dev = [
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena_mcp"]
